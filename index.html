<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A playful HR-themed memory matching game featuring HRIS, recruiting, payroll, benefits, learning, and employee engagement.">
  <title>HR Memory Match</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a2d5a'/%3E%3Cpath d='M20 17h24a5 5 0 0 1 5 5v20a5 5 0 0 1-5 5H20a5 5 0 0 1-5-5V22a5 5 0 0 1 5-5Z' fill='%23f5b8d1'/%3E%3Cpath d='M24 27h16M24 37h16M32 22v20' stroke='%231a2d5a' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --navy: #17284f;
      --blue: #315bd6;
      --sky: #dce9ff;
      --pink: #ee6da5;
      --pink-light: #ffe3ef;
      --gold: #f7bd48;
      --ink: #17213b;
      --muted: #65708a;
      --paper: #fffafd;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(23, 40, 79, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(238, 109, 165, .18), transparent 25rem),
        radial-gradient(circle at 90% 85%, rgba(49, 91, 214, .20), transparent 28rem),
        linear-gradient(145deg, #fff7fb 0%, #eef4ff 100%);
    }

    .shell {
      width: min(920px, 100%);
      position: relative;
      padding: clamp(22px, 4vw, 42px);
      border: 1px solid rgba(49, 91, 214, .13);
      border-radius: 32px;
      background: rgba(255, 255, 255, .78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--pink);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(2rem, 5vw, 3.65rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .instructions {
      max-width: 460px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .restart {
      flex: 0 0 auto;
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      color: var(--white);
      background: var(--navy);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(23, 40, 79, .2);
      transition: transform .18s ease, background .18s ease;
    }

    .restart:hover { background: var(--blue); transform: translateY(-2px); }
    .restart:focus-visible { outline: 4px solid rgba(238, 109, 165, .35); outline-offset: 3px; }

    .scorebar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      padding: 13px 16px;
      border-radius: 16px;
      background: var(--white);
      border: 1px solid rgba(23, 40, 79, .09);
    }

    .stat > span {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .stat strong { color: var(--navy); font-size: 1.35rem; }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 16px);
      perspective: 1000px;
    }

    .card {
      position: relative;
      aspect-ratio: 1 / .92;
      padding: 0;
      border: 0;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform .42s cubic-bezier(.2,.75,.25,1.15);
    }

    .card:hover:not(.flipped) { transform: translateY(-4px) rotate(-1deg); }
    .card.flipped, .card.matched { transform: rotateY(180deg); }
    .card:focus-visible { outline: 4px solid rgba(238, 109, 165, .45); outline-offset: 3px; }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 10px;
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 9px 22px rgba(23, 40, 79, .13);
    }

    .back {
      color: white;
      background:
        linear-gradient(135deg, rgba(255,255,255,.12) 25%, transparent 25%) 0 0 / 24px 24px,
        linear-gradient(315deg, rgba(255,255,255,.09) 25%, transparent 25%) 0 0 / 24px 24px,
        linear-gradient(145deg, var(--navy), var(--blue));
      border: 3px solid white;
    }

    .back-mark {
      display: grid;
      place-items: center;
      width: 54%;
      aspect-ratio: 1;
      border: 2px solid rgba(255,255,255,.72);
      border-radius: 50%;
      font-size: clamp(1.6rem, 4vw, 2.7rem);
      font-weight: 900;
      letter-spacing: -.08em;
      background: rgba(255,255,255,.1);
    }

    .front {
      grid-template-rows: 1fr auto;
      gap: 4px;
      color: var(--navy);
      background: var(--white);
      border: 2px solid var(--pink-light);
      transform: rotateY(180deg);
    }

    .icon {
      align-self: end;
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 1;
      filter: drop-shadow(0 5px 7px rgba(23, 40, 79, .12));
    }

    .label {
      align-self: start;
      font-size: clamp(.75rem, 2vw, .96rem);
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
    }

    .matched .front {
      background: linear-gradient(145deg, #fff, var(--pink-light));
      border-color: var(--pink);
      animation: matchPop .45s ease;
    }

    .message {
      min-height: 28px;
      margin: 18px 0 0;
      color: var(--navy);
      font-weight: 750;
      text-align: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(23, 40, 79, .48);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .overlay.show { opacity: 1; visibility: visible; }

    .win-card {
      width: min(440px, 100%);
      padding: 34px;
      border-radius: 28px;
      background: var(--white);
      box-shadow: var(--shadow);
      text-align: center;
      transform: scale(.88);
      transition: transform .32s ease;
    }

    .overlay.show .win-card { transform: scale(1); }
    .trophy { display: block; font-size: 4rem; }
    .win-card h2 { margin: 6px 0 8px; color: var(--navy); font-size: 2rem; }
    .win-card p { margin: 0 0 22px; color: var(--muted); line-height: 1.55; }

    @keyframes matchPop {
      50% { transform: rotateY(180deg) scale(1.08); }
    }

    @media (max-width: 680px) {
      body { padding: 12px; align-items: start; }
      .shell { margin-top: 8px; border-radius: 24px; }
      header { align-items: start; flex-direction: column; gap: 14px; }
      .restart { width: 100%; }
      .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .card { aspect-ratio: 1 / 1.02; border-radius: 16px; }
    }

    @media (max-width: 390px) {
      .shell { padding: 18px; }
      .scorebar { gap: 7px; }
      .stat { padding: 10px 8px; text-align: center; }
      .stat strong { font-size: 1.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">People + Technology</p>
        <h1>HR Memory Match</h1>
        <p class="instructions">Flip two cards at a time and match all six HR pairs. The timer begins with your first card.</p>
      </div>
      <button class="restart" id="restart" type="button">New game</button>
    </header>

    <section class="scorebar" aria-label="Game statistics">
      <div class="stat"><span>Moves</span><strong id="moves">0</strong></div>
      <div class="stat"><span>Matches</span><strong><span id="matches">0</span>/6</strong></div>
      <div class="stat"><span>Time</span><strong id="timer">0:00</strong></div>
    </section>

    <section class="board" id="board" aria-label="HR memory card board"></section>
    <p class="message" id="message" aria-live="polite">Choose a card to begin.</p>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="win-card">
      <span class="trophy" aria-hidden="true">🏆</span>
      <h2 id="win-title">Great match!</h2>
      <p id="win-copy"></p>
      <button class="restart" id="play-again" type="button">Play again</button>
    </div>
  </div>

  <script>
    const themes = [
      { id: "hris", icon: "💻", label: "HRIS" },
      { id: "recruiting", icon: "🔎", label: "Recruiting" },
      { id: "payroll", icon: "💵", label: "Payroll" },
      { id: "benefits", icon: "🩺", label: "Benefits" },
      { id: "learning", icon: "🎓", label: "Learning" },
      { id: "engagement", icon: "🤝", label: "Engagement" }
    ];

    const board = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const matchesEl = document.getElementById("matches");
    const timerEl = document.getElementById("timer");
    const messageEl = document.getElementById("message");
    const overlay = document.getElementById("overlay");
    const winCopy = document.getElementById("win-copy");

    let firstCard = null;
    let secondCard = null;
    let boardLocked = false;
    let moves = 0;
    let matches = 0;
    let seconds = 0;
    let timerId = null;
    let started = false;

    function shuffle(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function formatTime(value) {
      return `${Math.floor(value / 60)}:${String(value % 60).padStart(2, "0")}`;
    }

    function beginTimer() {
      if (started) return;
      started = true;
      timerId = window.setInterval(() => {
        seconds += 1;
        timerEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function makeCard(theme, index) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.dataset.theme = theme.id;
      card.setAttribute("aria-label", `Hidden memory card ${index + 1}`);
      card.setAttribute("aria-pressed", "false");
      card.innerHTML = `
        <span class="face back" aria-hidden="true"><span class="back-mark">HR</span></span>
        <span class="face front"><span class="icon" aria-hidden="true">${theme.icon}</span><span class="label">${theme.label}</span></span>
      `;
      card.addEventListener("click", () => flipCard(card, theme));
      return card;
    }

    function flipCard(card, theme) {
      if (boardLocked || card === firstCard || card.classList.contains("matched")) return;
      beginTimer();
      card.classList.add("flipped");
      card.setAttribute("aria-pressed", "true");
      card.setAttribute("aria-label", `${theme.label} card`);

      if (!firstCard) {
        firstCard = card;
        messageEl.textContent = `${theme.label} selected. Find its match.`;
        return;
      }

      secondCard = card;
      moves += 1;
      movesEl.textContent = moves;
      checkMatch();
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.theme === secondCard.dataset.theme;
      if (isMatch) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        firstCard.disabled = true;
        secondCard.disabled = true;
        matches += 1;
        matchesEl.textContent = matches;
        messageEl.textContent = "Match found! Keep going.";
        resetTurn();
        if (matches === themes.length) finishGame();
        return;
      }

      boardLocked = true;
      messageEl.textContent = "Not a match—try again.";
      window.setTimeout(() => {
        [firstCard, secondCard].forEach(card => {
          card.classList.remove("flipped");
          card.setAttribute("aria-pressed", "false");
          card.setAttribute("aria-label", "Hidden memory card");
        });
        resetTurn();
      }, 850);
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      boardLocked = false;
    }

    function finishGame() {
      window.clearInterval(timerId);
      messageEl.textContent = "You matched every HR pair!";
      winCopy.textContent = `You completed the board in ${moves} moves and ${formatTime(seconds)}.`;
      window.setTimeout(() => {
        overlay.classList.add("show");
        document.getElementById("play-again").focus();
      }, 500);
    }

    function newGame() {
      window.clearInterval(timerId);
      firstCard = null;
      secondCard = null;
      boardLocked = false;
      moves = 0;
      matches = 0;
      seconds = 0;
      started = false;
      movesEl.textContent = "0";
      matchesEl.textContent = "0";
      timerEl.textContent = "0:00";
      messageEl.textContent = "Choose a card to begin.";
      overlay.classList.remove("show");
      board.replaceChildren();
      const deck = shuffle([...themes, ...themes]);
      deck.forEach((theme, index) => board.appendChild(makeCard(theme, index)));
    }

    document.getElementById("restart").addEventListener("click", newGame);
    document.getElementById("play-again").addEventListener("click", newGame);
    overlay.addEventListener("click", event => {
      if (event.target === overlay) newGame();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && overlay.classList.contains("show")) newGame();
    });

    newGame();
  </script>
</body>
</html>
